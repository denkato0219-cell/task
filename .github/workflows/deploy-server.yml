name: Deploy notification server

# Runs when server code changes, or by hand from the Actions tab ("Run workflow").
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/deploy-server.yml"]

permissions:
  contents: write # to save the server address into config.js

concurrency: deploy-server

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5

      - name: Check secrets
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "${{ secrets.ORG_KEY }}" ] || missing="$missing ORG_KEY"
          if [ -n "$missing" ]; then
            echo "::error::GitHub の Settings → Secrets and variables → Actions に次を登録してください:$missing"
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Test
        run: npm test

      - name: Create database (first run only)
        run: |
          find_id() { npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const db=JSON.parse(s).find(d=>d.name==="kyou-yotei");console.log(db?db.uuid:"")})'; }
          ID=$(find_id)
          if [ -z "$ID" ]; then
            npx wrangler d1 create kyou-yotei
            ID=$(find_id)
          fi
          [ -n "$ID" ] || { echo "::error::データベースを作れませんでした。APIトークンに D1 の編集権限があるか確認してください"; exit 1; }
          sed -i "s/REPLACE_WITH_D1_ID/$ID/" wrangler.toml
          npx wrangler d1 execute kyou-yotei --remote --file=schema.sql

      - name: Make sure the workers.dev address exists
        id: sub
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          GET=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API")
          why() { node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.log((j.errors||[]).map(e=>e.code+" "+e.message).join(" / ")||"-")}catch{console.log(s.slice(0,200))}})'; }
          echo "subdomain check: $(echo "$GET" | why)"
          SUB=$(echo "$GET" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).result?.subdomain||"")}catch{console.log("")}})')
          if [ -z "$SUB" ]; then
            NEW="kyou-yotei-$(openssl rand -hex 3)"
            echo "workers.dev のサブドメインがないので $NEW を作ります"
            RES=$(curl -s -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data "{\"subdomain\":\"$NEW\"}" "$API")
            echo "$RES" | grep -q '"success":true' || { echo "::error::Cloudflare の答え（確認）: $(echo "$GET" | why) ／（作成）: $(echo "$RES" | why)"; echo "::error::workers.dev のサブドメインを作れませんでした。Cloudflare の「Workers & Pages」を開いてサブドメインを登録してから、もう一度 Run workflow してください"; exit 1; }
            SUB="$NEW"
          fi
          echo "subdomain=$SUB" >> "$GITHUB_OUTPUT"

      - name: Deploy
        id: deploy
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee deploy.log || { echo "::error::サーバーの公開に失敗しました。上のログの ERROR の行を確認してください"; exit 1; }
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          [ -n "$URL" ] || URL="https://kyou-yotei.${{ steps.sub.outputs.subdomain }}.workers.dev"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "server: $URL"

      - name: Set office key
        run: printf '%s' "${{ secrets.ORG_KEY }}" | npx wrangler secret put ORG_KEY

      - name: Save server address to config.js
        working-directory: .
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          printf '%s\n' \
            '// Address of the notification server (Cloudflare Worker). Filled in automatically by the' \
            '// "Deploy notification server" GitHub Action; leave empty to use the app without it.' \
            "window.KYOU_CONFIG = { server: \"$URL\" };" > config.js
          if git diff --quiet config.js; then echo "config.js is up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "通知サーバーのアドレスを config.js に保存" config.js
          git push
          echo "### 通知サーバー: $URL" >> "$GITHUB_STEP_SUMMARY"
